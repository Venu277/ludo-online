<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Online</title>
    <link rel="stylesheet" href="/style.css?v=2.0">
</head>
<body>
    
    <header class="app-header">
        <h1 id="roomDisplay">Room: <span></span></h1>
        <button id="themeToggle" class="icon-btn" aria-label="Toggle Theme">☀️</button>
    </header>

    <!-- Pre-game setup (Hidden when game starts) -->
    <div id="setupContainer" class="panel setup-panel">
        <input type="text" id="playerName" placeholder="Your Name">
        <input type="text" id="roomCode" placeholder="Room Code">
        <button id="joinBtn" class="primary-btn">JOIN GAME</button>
    </div>

    <!-- Main Game UI (Hidden until joined) -->
    <main id="gameContainer" class="game-layout" style="display: none;">
        
        <!-- Left Side: The Board -->
        <div class="board-wrapper skeuomorphic-depth">
            <canvas id="ludoBoard" width="600" height="600"></canvas>
        </div>

        <!-- Right Side: Controls and Chat -->
        <aside class="sidebar">
            
            <div class="panel control-panel">
                <div class="section-header">PLAYERS</div>
                <ul id="playerList" class="player-list"></ul>
                
                <button id="rollBtn" class="primary-btn 3d-push">ROLL DICE</button>
                
                <div class="dice-display skeuomorphic-inset">
                    <span id="diceValue">🎲</span>
                </div>
            </div>

            <div class="panel chat-panel">
                <div class="section-header">CHAT</div>
                <div id="chatMessages" class="chat-box skeuomorphic-inset"></div>
                
                <div class="chat-input-area">
                    <div class="quick-emojis">
                        <button class="emoji-btn">🎲</button>
                        <button class="emoji-btn">😂</button>
                        <button class="emoji-btn">😭</button>
                        <button class="emoji-btn">😡</button>
                        <button class="emoji-btn">🎉</button>
                    </div>
                    <div class="input-group">
                        <input type="text" id="chatInput" placeholder="Type message...">
                        <button id="sendMsgBtn" class="send-btn">Send</button>
                    </div>
                </div>
            </div>

        </aside>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js?v=2.0"></script>
</body>
</html>
